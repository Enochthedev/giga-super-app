name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    name: Typecheck, format, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # package.json engines: >=20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -p tsconfig.build.json --noEmit

      - name: Prettier
        run: pnpm run format:check

      - name: Tests
        run: pnpm test

      # Not gating yet: 226 errors and 1,145 warnings across the services,
      # mostly no-unused-vars, missing radix and no-explicit-any. Tracked in the
      # issue list; the count here is the baseline to bring down.
      - name: ESLint (report only)
        run: pnpm exec eslint . --ext .ts,.js || true

  security:
    name: Security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 19 high and 23 moderate advisories remain, most of them transitive with
      # no patched version that Express 4 tolerates. Report, do not gate, until
      # that count is down — see the issue tracker.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
