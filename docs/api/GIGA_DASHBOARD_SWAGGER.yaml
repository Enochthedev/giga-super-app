openapi: 3.0.3
info:
  title: GIGA Dashboard API
  version: 2.0.0
  description: |
    # GIGA Dashboard API Documentation

    Complete API documentation for the GIGA Dashboard system including authentication, dashboard statistics, business modules, and administrative features.

    ## 🔐 Authentication
    All endpoints require JWT authentication via Supabase Auth:
    ```
    Authorization: Bearer <jwt_token>
    ```

    ## 🌐 Base URLs
    - **API Gateway (Recommended)**: https://your-api-gateway.railway.app
    - **Direct Admin Service**: https://your-admin-service.railway.app
    - **Local Development**: http://localhost:3000 (API Gateway) or http://localhost:3005 (Admin Service)

    ## 📊 Access Levels
    - **National**: Full access to all data and statistics
    - **State**: Access to state-specific data only  
    - **Branch**: Access to branch-specific data only
    - **Manager**: Limited access to assigned region/branch

    ## 🔍 Pagination & Search
    Most list endpoints support:
    - **Pagination**: `?page=1&limit=20`
    - **Search**: `?search=keyword`
    - **Filtering**: `?status=active&region=lagos`

  contact:
    name: GIGA Platform Team
    email: api@giga.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://your-api-gateway.railway.app
    description: API Gateway (Recommended)
  - url: https://your-admin-service.railway.app
    description: Direct Admin Service
  - url: http://localhost:3000
    description: Local Development (API Gateway)
  - url: http://localhost:3005
    description: Local Development (Admin Service)

tags:
  - name: Authentication
    description: User authentication endpoints via Supabase Auth
  - name: Dashboard
    description: GIGA Dashboard statistics and analytics
  - name: Manager - E-commerce
    description: E-commerce products, orders, vendors management for managers
  - name: Manager - Taxi
    description: Taxi drivers, rides, and earnings management for managers
  - name: Manager - Hotel
    description: Hotels, bookings, rooms, and reviews management for managers
  - name: Manager - Media
    description: Media files, hotel photos, and advertisements management for managers
  - name: Business Modules
    description: E-commerce, taxi, hotel, media management
  - name: Postal Monitoring
    description: Postal staff and operations management
  - name: Manager Operations
    description: Post office manager specific endpoints
  - name: Advertisement Management
    description: Ad review and approval workflow
  - name: Admin Panel
    description: Administrative categories and settings

security:
  - BearerAuth: []

paths:
  # Authentication Endpoints
  /api/v1/auth/token:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with email and password to get JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, grant_type]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: password123
                grant_type:
                  type: string
                  enum: [password]
                  example: password
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token
                  refresh_token:
                    type: string
                    description: Refresh token
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds
                  user:
                    type: object
                    description: User information
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/user:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Get current authenticated user information
      responses:
        200:
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  user_metadata:
                    type: object
        401:
          $ref: '#/components/responses/Unauthorized'

  # Dashboard Endpoints
  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get main dashboard statistics
      description: Retrieve comprehensive dashboard statistics including revenue, orders, visitors, and conversion rates
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Start date for statistics (defaults to 30 days ago)
          example: '2026-01-01'
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: End date for statistics (defaults to today)
          example: '2026-01-29'
      responses:
        200:
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/dashboard/sales-comparison:
    get:
      tags: [Dashboard]
      summary: Get sales comparison data
      description: Compare sales between current and previous periods with percentage change
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Start date for current period
          example: '2026-01-01'
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: End date for current period
          example: '2026-01-29'
      responses:
        200:
          description: Sales comparison data retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SalesComparison'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/dashboard/category-breakdown:
    get:
      tags: [Dashboard]
      summary: Get category breakdown
      description: Get revenue and metrics breakdown by business category (ecommerce, hotel, taxi, media)
      responses:
        200:
          description: Category breakdown retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryBreakdown'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  # Admin Panel Endpoints
  /api/admin/categories:
    get:
      tags: [Admin Panel]
      summary: Get business categories
      description: Retrieve list of available business categories for the platform
      responses:
        200:
          description: Business categories retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BusinessCategory'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  # Business Module Endpoints
  /api/ecommerce/traders:
    get:
      tags: [Business Modules]
      summary: Get e-commerce traders
      description: Retrieve paginated list of e-commerce traders/vendors with search and filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by business name
          example: 'electronics'
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by trader status
      responses:
        200:
          description: Traders retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          traders:
                            type: array
                            items:
                              $ref: '#/components/schemas/Trader'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/taxi/drivers:
    get:
      tags: [Business Modules]
      summary: Get taxi drivers
      description: Retrieve paginated list of taxi drivers with search and filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by license number or driver name
          example: 'LIC123'
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by driver status
      responses:
        200:
          description: Drivers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          drivers:
                            type: array
                            items:
                              $ref: '#/components/schemas/Driver'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/hotel/hotels:
    get:
      tags: [Business Modules]
      summary: Get hotels
      description: Retrieve paginated list of hotels with search and filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by hotel name, city, or state
          example: 'Grand Lagos'
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by hotel status
      responses:
        200:
          description: Hotels retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hotels:
                            type: array
                            items:
                              $ref: '#/components/schemas/Hotel'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/media/content:
    get:
      tags: [Business Modules]
      summary: Get media content
      description: Retrieve paginated list of media content with filtering by type
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: type
          schema:
            type: string
            enum: [image, video, document, audio]
          description: Filter by media type
      responses:
        200:
          description: Media content retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/MediaContent'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  # Postal Monitoring Endpoints
  /api/postal-monitoring/staff:
    get:
      tags: [Postal Monitoring]
      summary: Get postal staff
      description: Retrieve paginated list of postal staff with search and filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by staff name or ID
          example: 'David'
        - in: query
          name: region
          schema:
            type: string
          description: Filter by postal region
          example: 'Lagos'
        - in: query
          name: office
          schema:
            type: string
          description: Filter by office location
          example: 'Lagos Central Post Office'
      responses:
        200:
          description: Postal staff retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          staff:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostalStaff'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/operations/staff:
    get:
      tags: [Postal Monitoring]
      summary: Get operations staff
      description: Alias endpoint for postal staff - same functionality as /api/postal-monitoring/staff
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by staff name or ID
        - in: query
          name: region
          schema:
            type: string
          description: Filter by postal region
        - in: query
          name: office
          schema:
            type: string
          description: Filter by office location
      responses:
        200:
          description: Operations staff retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          staff:
                            type: array
                            items:
                              $ref: '#/components/schemas/PostalStaff'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  # Manager Operations Endpoints
  /api/managers/dashboard-stats:
    get:
      tags: [Manager Operations]
      summary: Get manager dashboard statistics
      description: Get dashboard statistics specific to the manager's assigned branch or region
      responses:
        200:
          description: Manager dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalRevenue:
                            type: number
                            example: 125000.50
                          totalOrders:
                            type: integer
                            example: 450
                          avgOrderValue:
                            type: number
                            example: 277.78
                          recentActivity:
                            type: array
                            items:
                              type: object
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/managers/latest-orders:
    get:
      tags: [Manager Operations]
      summary: Get latest orders
      description: Retrieve the most recent orders for manager review
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Number of orders to retrieve
      responses:
        200:
          description: Latest orders retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/Order'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/managers/orders/{id}:
    put:
      tags: [Manager Operations]
      summary: Update order
      description: Update order status and add notes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
                  example: processing
                notes:
                  type: string
                  example: 'Order processed and ready for shipping'
      responses:
        200:
          description: Order updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: '#/components/schemas/Order'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Manager Operations]
      summary: Delete order
      description: Soft delete an order (sets deleted_at timestamp)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID
      responses:
        200:
          description: Order deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 'Order deleted successfully'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  # Advertisement Management Endpoints
  /api/ads/incoming:
    get:
      tags: [Advertisement Management]
      summary: Get incoming ads for review
      description: Retrieve paginated list of advertisements pending review
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, pending_approval, active, paused, completed, cancelled, rejected]
            default: pending_approval
          description: Filter by advertisement status
      responses:
        200:
          description: Incoming ads retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ads:
                            type: array
                            items:
                              $ref: '#/components/schemas/Advertisement'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/ads/{id}/status:
    put:
      tags: [Advertisement Management]
      summary: Update advertisement status
      description: Approve or reject an advertisement campaign
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Advertisement ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, rejected, paused, cancelled]
                  example: active
                  description: New status for the campaign (active = approved)
                review_notes:
                  type: string
                  example: 'Campaign approved for publication'
      responses:
        200:
          description: Advertisement status updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ad:
                            $ref: '#/components/schemas/Advertisement'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'

  # E-commerce Endpoints
  /api/ecommerce/products:
    get:
      tags: [E-commerce]
      summary: Get e-commerce products
      description: Retrieve paginated list of products with search and filtering
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by product name or SKU
        - in: query
          name: category_id
          schema:
            type: string
            format: uuid
        - in: query
          name: vendor_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
      responses:
        200:
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items:
                              $ref: '#/components/schemas/Product'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [E-commerce]
      summary: Create new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_price, vendor_id]
              properties:
                name:
                  type: string
                base_price:
                  type: number
                vendor_id:
                  type: string
                  format: uuid
                category_id:
                  type: string
                  format: uuid
                description:
                  type: string
                sku:
                  type: string
                stock_quantity:
                  type: integer
                discount_percentage:
                  type: integer
      responses:
        201:
          description: Product created successfully
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/ecommerce/products/{id}:
    get:
      tags: [E-commerce]
      summary: Get product details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Product details retrieved successfully
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [E-commerce]
      summary: Update product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Product updated successfully
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [E-commerce]
      summary: Soft delete product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Product deleted successfully
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/ecommerce/orders:
    get:
      tags: [E-commerce]
      summary: Get e-commerce orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: search
          schema:
            type: string
          description: Search by order number or email
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled, refunded]
        - in: query
          name: payment_status
          schema:
            type: string
            enum: [pending, paid, failed, refunded]
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        200:
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/EcommerceOrder'
        401:
          $ref: '#/components/responses/Unauthorized'
        500:
          $ref: '#/components/responses/InternalServerError'

  /api/ecommerce/orders/{id}:
    get:
      tags: [E-commerce]
      summary: Get order details with items
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Order details retrieved successfully
        404:
          $ref: '#/components/responses/NotFound'
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/ecommerce/orders/{id}/status:
    put:
      tags: [E-commerce]
      summary: Update order status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled, refunded]
                notes:
                  type: string
                tracking_number:
                  type: string
                carrier:
                  type: string
      responses:
        200:
