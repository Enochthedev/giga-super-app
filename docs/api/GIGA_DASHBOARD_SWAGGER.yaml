components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase Auth (required for all endpoints)

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - invalid or missing JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Response schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: 'Error message'

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 8

    # Dashboard schemas
    DashboardStats:
      type: object
      properties:
        revenue:
          type: object
          properties:
            value:
              type: number
              example: 125000.50
            change:
              type: string
              example: '+22%'
            trend:
              type: string
              enum: [up, down]
              example: up
        orders:
          type: object
          properties:
            value:
              type: integer
              example: 1250
            change:
              type: string
              example: '+15%'
            trend:
              type: string
              enum: [up, down]
              example: up
        visitors:
          type: object
          properties:
            value:
              type: integer
              example: 15500
            change:
              type: string
              example: '+49%'
            trend:
              type: string
              enum: [up, down]
              example: up
        conversion:
          type: object
          properties:
            value:
              type: number
              example: 28.5
            change:
              type: string
              example: '+1.9%'
            trend:
              type: string
              enum: [up, down]
              example: up

    SalesComparison:
      type: object
      properties:
        current_period:
          type: object
          properties:
            sales:
              type: number
              example: 125000.50
            start_date:
              type: string
              format: date
              example: '2026-01-01'
            end_date:
              type: string
              format: date
              example: '2026-01-29'
        previous_period:
          type: object
          properties:
            sales:
              type: number
              example: 98000.25
            start_date:
              type: string
              format: date
              example: '2025-12-03'
            end_date:
              type: string
              format: date
              example: '2025-12-31'
        change:
          type: object
          properties:
            amount:
              type: number
              example: 27000.25
            percentage:
              type: number
              example: 27.55
            trend:
              type: string
              enum: [up, down]
              example: up

    CategoryBreakdown:
      type: object
      properties:
        ecommerce:
          type: object
          properties:
            revenue:
              type: number
              example: 45000.00
            orders:
              type: integer
              example: 450
            vendors:
              type: integer
              example: 125
        hotel:
          type: object
          properties:
            revenue:
              type: number
              example: 35000.00
            bookings:
              type: integer
              example: 180
            hotels:
              type: integer
              example: 45
        taxi:
          type: object
          properties:
            revenue:
              type: number
              example: 25000.00
            rides:
              type: integer
              example: 850
            drivers:
              type: integer
              example: 200
        media:
          type: object
          properties:
            content_items:
              type: integer
              example: 1250
            social_posts:
              type: integer
              example: 3500
            engagement:
              type: integer
              example: 15000

    # Business module schemas
    Trader:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_name:
          type: string
          example: 'Lagos Electronics Store'
        business_description:
          type: string
          example: 'Electronics and gadgets retailer'
        total_sales:
          type: number
          example: 125000.50
        total_orders:
          type: integer
          example: 450
        average_rating:
          type: number
          example: 4.5
        is_verified:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        user_profiles:
          type: object
          properties:
            first_name:
              type: string
              example: 'John'
            last_name:
              type: string
              example: 'Doe'
            email:
              type: string
              example: 'john@example.com'
            avatar_url:
              type: string
              example: 'https://example.com/avatar.jpg'

    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        license_number:
          type: string
          example: 'LIC123456789'
        vehicle_type:
          type: string
          example: 'sedan'
        vehicle_model:
          type: string
